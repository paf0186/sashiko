log_level = "info"

[database]
url = "sashiko.db"
token = ""

[mailing_lists]
track = []

[nntp]
server = "nntp.lore.kernel.org"
port = 119

[ai]
provider = "claude-cli"
model = "claude-opus-4-6"
max_input_tokens = 180000
max_interactions = 150
temperature = 1.0

[ai.claude]
prompt_caching = true

[server]
host = "127.0.0.1"
port = 8080

[git]
repository_path = "/home/paf/lustre-release"

[review]
concurrency = 1
worktree_dir = "review_trees"
timeout_seconds = 3600
max_retries = 3
ignore_files = ["MAINTAINERS", ".mailmap", ".gitignore"]
# Token budget: abort a review if cumulative tokens (input+output) exceed this.
# ~500k tokens ≈ $1.50 at sonnet-4-6 pricing. Set 0 to disable.
max_total_tokens = 500000
