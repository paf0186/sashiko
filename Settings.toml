log_level = "info"

[database]
url = "sashiko.db"
token = ""

[mailing_lists]
track = []

[nntp]
server = "nntp.lore.kernel.org"
port = 119

[ai]
provider = "claude"
model = "claude-sonnet-4-5"
max_input_tokens = 180000
max_interactions = 50
temperature = 1.0

[ai.claude]
prompt_caching = true

[server]
host = "127.0.0.1"
port = 8080

[git]
repository_path = "/home/paf/lustre-release"

[review]
concurrency = 1
worktree_dir = "review_trees"
timeout_seconds = 3600
max_retries = 3
ignore_files = ["MAINTAINERS", ".mailmap", ".gitignore"]
